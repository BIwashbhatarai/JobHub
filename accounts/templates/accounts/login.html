{% extends "base.html" %}

{% block title %} Login | JobHub {% endblock %}

{% block content %}

<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background: #f4f6f9;
    }

    .login-container{
        width: 400px;
        margin: 60px auto;
        background: #fff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .login-container h2{
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    form p{
        margin-bottom: 18px;
    }

    form label{
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #444;
    }

    form input,
    form select,
    form textarea{
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
        outline: none;
    }

    form input:focus,
    form select:focus,
    form textarea:focus{
        border-color: #0d6efd;
    }

    button{
        width: 100%;
        padding: 12px;
        background: #0d6efd;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover{
        background: #0b5ed7;
    }

    .helptext{
        display: block;
        font-size: 13px;
        color: #777;
        margin-top: 5px;
    }

    .errorlist{
        list-style: none;
        color: red;
        margin-top: 5px;
        margin-bottom: 10px;
        font-size: 14px;
    }
</style>

<div class="login-container">
    <h2>Login</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>
</div>

{% endblock %}
