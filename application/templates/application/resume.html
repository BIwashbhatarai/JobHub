{% extends "base.html" %}

{% block title %}Resume Management{% endblock %}

{% block content %}

<style>

body{
    background:#f5f7fb;
}

.resume-container{
    max-width:850px;
    margin:50px auto;
}

.resume-card{
    border:none;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,.06);
}

.resume-header{
    padding:30px;
    border-bottom:1px solid #eee;
}

.resume-header h2{
    font-weight:700;
    color:#0d6efd;
    margin-bottom:5px;
}

.resume-header p{
    color:#6c757d;
    margin:0;
}

.resume-body{
    padding:35px;
}

.resume-icon{
    font-size:70px;
    color:#dc3545;
}

.resume-name{
    font-size:22px;
    font-weight:600;
    margin-top:20px;
}

.resume-info{
    color:#6c757d;
    margin-bottom:25px;
}

.btn{
    border-radius:10px;
}

.upload-box{
    border:2px dashed #ced4da;
    border-radius:15px;
    padding:35px;
    text-align:center;
    background:white;
}

.upload-box:hover{
    border-color:#0d6efd;
}

.empty-icon{
    font-size:70px;
    color:#adb5bd;
}

</style>

<div class="container resume-container">

    <div class="card resume-card">

        <div class="resume-header">
            <h2>Resume Management</h2>
            <p>Upload and manage your resume for job applications.</p>
        </div>

        <div class="resume-body">

            <!-- ========================= -->
            <!-- Resume Exists -->
            <!-- Uncomment this section when resume exists -->
            <!-- ========================= -->

            <!--

            <div class="text-center">

                <div class="resume-icon">
                    📄
                </div>

                <div class="resume-name">
                    my_resume.pdf
                </div>

                <div class="resume-info">
                    Uploaded: 27 July 2026
                    <br>
                    File Size: 285 KB
                </div>

                <div class="d-flex justify-content-center gap-3 flex-wrap">

                    <a href="#" class="btn btn-primary">
                        View Resume
                    </a>

                    <a href="#" class="btn btn-success">
                        Download
                    </a>

                    <a href="#" class="btn btn-warning">
                        Replace Resume
                    </a>

                    <a href="#" class="btn btn-danger">
                        Delete
                    </a>

                </div>

            </div>

            -->


            <!-- ========================= -->
            <!-- Empty State -->
            <!-- ========================= -->

            <div class="upload-box">

                <div class="empty-icon">
                    📄
                </div>

                <h4 class="mt-3">
                    No Resume Uploaded
                </h4>

                <p class="text-muted mb-4">
                    Upload your resume once and use it while applying for jobs.
                </p>

                <form method="POST" enctype="multipart/form-data">

                    {% csrf_token %}

                    <div class="mb-4">

                        <input
                            type="file"
                            class="form-control"
                            name="resume"
                            accept=".pdf,.doc,.docx">

                    </div>

                    <button class="btn btn-primary px-4">
                        Upload Resume
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
