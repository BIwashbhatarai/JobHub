{% extends "base.html" %}

{% block title %}Apply for Job{% endblock %}

{% block content %}

<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        background:#f4f6f9;
    }

    .container{
        max-width:700px;
        margin:40px auto;
        background:white;
        padding:30px;
        border-radius:10px;
        box-shadow:0 8px 20px rgba(0,0,0,.1);
    }

    h2{
        text-align:center;
        margin-bottom:10px;
        color:#333;
    }

    .job-info{
        background:#eef4ff;
        border-left:5px solid #2563eb;
        padding:15px;
        border-radius:6px;
        margin-bottom:25px;
    }

    .job-info h3{
        margin-bottom:8px;
    }

    .job-info p{
        margin:5px 0;
        color:#555;
    }

    .form-group{
        margin-bottom:20px;
    }

    label{
        display:block;
        margin-bottom:8px;
        font-weight:bold;
    }

    input[type="file"],
    textarea{
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:6px;
        font-size:15px;
    }

    textarea{
        height:180px;
        resize:vertical;
    }

    button{
        width:100%;
        padding:14px;
        border:none;
        background:#2563eb;
        color:white;
        font-size:16px;
        border-radius:6px;
        cursor:pointer;
    }

    button:hover{
        background:#1d4ed8;
    }
</style>

<div class="container">

    <h2>Apply for Job</h2>

    <div class="job-info">
        <h3>{{job.title}}</h3>
        <p><strong>Company:</strong> {{job.company_name}}</p>
        <p><strong>Location:</strong> {{job.location}}</p>
        <p><strong>Salary:</strong> Rs.{{job.salary}}</p>
    </div>

    <form method="POST" action='' enctype="multipart/form-data">
        {% csrf_token %}

        {{form.as_p}}

        <button type="submit">
            Submit Application
        </button>

    </form>

</div>

{% endblock %}
