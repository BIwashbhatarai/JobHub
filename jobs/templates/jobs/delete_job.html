{% extends "base.html" %}

{% block content %}

<style>
    body {
        background: #f5f7fa;
    }

    .delete-container {
        max-width: 600px;
        margin: 80px auto;
    }

    .delete-card {
        background: #fff;
        padding: 35px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0,0,0,.08);
    }

    .delete-icon {
        font-size: 50px;
        margin-bottom: 20px;
    }

    .delete-card h2 {
        font-weight: 700;
        margin-bottom: 15px;
        color: #dc3545;
    }

    .delete-card p {
        color: #555;
        font-size: 16px;
        margin-bottom: 25px;
        line-height: 1.6;
    }

    .job-name {
        font-weight: 700;
        color: #333;
    }

    .button-group {
        display: flex;
        justify-content: center;
        gap: 15px;
    }

    .btn {
        padding: 12px 25px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: .3s;
    }

    .btn-delete {
        background: #dc3545;
        color: white;
    }

    .btn-delete:hover {
        background: #bb2d3b;
    }

    .btn-cancel {
        background: #6c757d;
        color: white;
    }

    .btn-cancel:hover {
        background: #5a6268;
        color: white;
    }

    @media(max-width:600px){

        .button-group {
            flex-direction: column;
        }

        .btn {
            width: 100%;
        }
    }

</style>


<div class="container delete-container">

    <div class="delete-card">

        <div class="delete-icon">
            ⚠️
        </div>

        <h2>Delete Job Post</h2>

        <p>
            Are you sure you want to delete
            <span class="job-name">
                "{{ job.title }}"
            </span>
            ?
            <br>
            This action cannot be undone.
        </p>


        <form method="POST">

            {% csrf_token %}

            <div class="button-group">

                <a href="{% url 'jobs:my_job_view' %}" class="btn btn-cancel">
                    Cancel
                </a>

                <button type="submit" class="btn btn-delete">
                    Yes, Delete
                </button>

            </div>

        </form>

    </div>

</div>


{% endblock %}
